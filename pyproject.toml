[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanodesk"
version = "0.1.0"
description = "Every app you have, one click away. No code, no terminal, no accounts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Agarwal" }]
keywords = ["launcher", "no-code", "gui", "offline", "local-ai", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = []

[project.scripts]
nanodesk = "nanodesk.__main__:main"

[project.urls]
Homepage = "https://github.com/Agarwalrishu13/nanodesk"

[tool.setuptools]
packages = ["nanodesk"]
include-package-data = true

[tool.setuptools.package-data]
nanodesk = ["web/*"]
